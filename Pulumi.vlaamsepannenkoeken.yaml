environment:
  - scaleway/vlaamsepannenkoeken
config:
  iac-scaleway-root-dns:zone: vlaamsepannenkoeken.be
  iac-scaleway-root-dns:mx:
    mx-1:
      name: ""
      ttl: 120
      priority: 1
      data: "aspmx.l.google.com."
    mx-2:
      name: ""
      ttl: 120
      priority: 5
      data: "alt1.aspmx.l.google.com."
    mx-3:
      name: ""
      ttl: 120
      priority: 5
      data: "alt2.aspmx.l.google.com."
    mx-4:
      name: ""
      ttl: 120
      priority: 10
      data: "alt3.aspmx.l.google.com."
    mx-5:
      name: ""
      ttl: 120
      priority: 10
      data: "alt4.aspmx.l.google.com."
  iac-scaleway-root-dns:txt:
    spf:
      name: ""
      ttl: 120
      data: "v=spf1 include:_spf.google.com ~all"
    dkim:
      name: "google._domainkey"
      ttl: 120
      data: "v=DKIM1; k=rsa; "
    scaleway-challenge:
      name: "_scaleway-challenge"
      ttl: 120
      data: "fc6effe1-5c54-4f7a-aa09-58991594b3cc"
    google-site-verification:
      name: ""
      ttl: 120
      data: "google-site-verification=kFNblVUoWtvsdEA3_noy8BtG3HwEEjXygCtQgeSdjvQ"
