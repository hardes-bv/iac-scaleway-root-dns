environment:
  - scaleway/atriso
config:
  iac-scaleway-root-dns:zone: atriso.be
  iac-scaleway-root-dns:mx:
    atriso-be-name-mx-1:
      name: ""
      ttl: 300
      priority: 10
      data: "smtp.mailbox.scw.eu."
  iac-scaleway-root-dns:cname:
    atriso-be-autoconfig:
      name: "autoconfig"
      ttl: 300
      data: "autoconfig.mailbox.scw.eu."
    atriso-be-autodiscover:
      name: "autodiscover"
      ttl: 300
      data: "autodiscover.mailbox.scw.eu."
  iac-scaleway-root-dns:srv:
    atriso-be-imap:
      name: "_imaps._tcp"
      ttl: 300
      data: "0 1 993 imap.mailbox.scw.eu."
    atriso-be-pop3:
      name: "_pop3s._tcp"
      ttl: 300
      data: "0 1 995 pop3.mailbox.scw.eu."
    atriso-be-submission:
      name: "_submissions._tcp"
      ttl: 300
      data: "0 1 465 smtp.mailbox.scw.eu."
    atriso-be-caldav:
      name: "_caldavs._tcp"
      ttl: 300
      data: "0 1 443 caldav.mailbox.scw.eu."
    atriso-be-carddav:
      name: "_carddavs._tcp"
      ttl: 300
      data: "0 1 443 carddav.mailbox.scw.eu."
  iac-scaleway-root-dns:txt:
    atriso-be-spf:
      name: ""
      ttl: 200
      data: "v=spf1 include:zohomail.eu include:spf.mailbox.scw.eu -all"
    atriso-be-zoho-dkim:
      name: "zmail._domainkey"
      ttl: 200
      data: "v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCsbo3hVMAj5ADwF9TPhCG7HowMgncnyzwshLtMeCBoBjLTmi76NPbevWOU3PouelXtde8low5LIvlJV8gloXxa9zCByXRRc1puV3HUl1uVgiuapV0E4ml6N6wKtZsBlCvpbUDtou/uAzIQlnNlXzFpbwbKZ/3LMLrzyhwX1epyDQIDAQAB"
    atriso-be-scaleway-dkim:
      name: "scw-mbox._domainkey"
      ttl: 200
      data: "v=DKIM1; h=sha256; k=rsa; "
    atriso-be-name-dmarc:
      name: "_dmarc"
      ttl: 200
      data: "v=DMARC1; p=none;"
    atriso-be-zoho-eu-validation:
      name: ""
      ttl: 200
      data: "zoho-verification=zb76213014.zmverify.zoho.eu"
    atriso-be-scaleway-validation:
      name: ""
      ttl: 200
      data: "scaleway-mailbox=a020e77d-ad5b-4133-8eba-b0da9540a4f3"
  iac-scaleway-root-dns:zones:
    - "home"